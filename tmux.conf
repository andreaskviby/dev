# ══════════════════════════════════════════════════════════════════════════════
# TMUX CONFIGURATION - Optimerad för vertikal 4-pane layout
# ══════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# GRUNDINSTÄLLNINGAR
# ─────────────────────────────────────────────────────────────────────────────

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -sg escape-time 0
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g focus-events on

# Visa pane titlar
set -g pane-border-status top
set -g pane-border-format " #{pane_index}: #{pane_title} "

# ─────────────────────────────────────────────────────────────────────────────
# KEYBINDINGS
# ─────────────────────────────────────────────────────────────────────────────

# Prefix: Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded! 🔄"

# Splits
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Nytt window i samma katalog
bind c new-window -c "#{pane_current_path}"

# Navigera panes med Alt+piltangenter (utan prefix)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Pane navigation med Ctrl+h/j/k/l (Warp-kompatibel, utan prefix)
bind -n C-h select-pane -L
bind -n C-l select-pane -R
bind -n C-k select-pane -U
bind -n C-j select-pane -D

# Vim-style navigation (med prefix)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -n S-Left resize-pane -L 2
bind -n S-Right resize-pane -R 2
bind -n S-Up resize-pane -U 1
bind -n S-Down resize-pane -D 1

# Session-navigation
bind Tab switch-client -l
bind J switch-client -n
bind K switch-client -p

# Kill utan bekräftelse
bind x kill-pane
bind X kill-window

# Snabb layout-fix för 4 vertikala panes
bind = select-layout even-horizontal

# ─────────────────────────────────────────────────────────────────────────────
# UTSEENDE - Nord tema
# ─────────────────────────────────────────────────────────────────────────────

# Statusbar
set -g status-position bottom
set -g status-style "bg=#2E3440,fg=#D8DEE9"
set -g status-left-length 50
set -g status-right-length 100

# Vänster: Session
set -g status-left "#[fg=#2E3440,bg=#88C0D0,bold]  #S #[fg=#88C0D0,bg=#2E3440]"

# Höger: Datum & tid
set -g status-right "#[fg=#4C566A]#[fg=#D8DEE9,bg=#4C566A] %Y-%m-%d │ %H:%M #[fg=#81A1C1]#[fg=#2E3440,bg=#81A1C1,bold] #H "

# Windows
set -g status-justify left
setw -g window-status-format "#[fg=#4C566A] #I:#W "
setw -g window-status-current-format "#[fg=#2E3440,bg=#5E81AC]#[fg=#ECEFF4,bg=#5E81AC,bold] #I:#W #[fg=#5E81AC,bg=#2E3440]"
setw -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#4C566A"
set -g pane-active-border-style "fg=#88C0D0"

# Pane border med titel (visar pane namn)
set -g pane-border-format "#[fg=#4C566A,bg=#2E3440] #{pane_index}:#{pane_title} #[default]"
set -g pane-active-border-style "fg=#88C0D0,bg=#2E3440"

# Messages
set -g message-style "bg=#88C0D0,fg=#2E3440,bold"

# Clock
setw -g clock-mode-colour "#88C0D0"
setw -g clock-mode-style 24

# Copy mode
setw -g mode-keys vi
setw -g mode-style "bg=#4C566A,fg=#ECEFF4"
